name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Export static web build
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: https://ai-rights-coach-backend.onrender.com

      - name: Inject white-screen diagnostics guard
        run: node inject-diagnostics.js

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3.114.17 pages deploy dist --project-name=ai-rights-coach --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
